<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montre et dis</title>
<style>
:root{/* plan : bandeau de 3 étapes en haut, une seule zone de travail dessous */
--bg:#eef1f4;--surface:#fff;--ink:#16202b;--muted:#5b6876;--line:#d3dae2;--accent:#2f5bea;--on:#fff;--rec:#e5383b;
--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12171d;--surface:#1b222b;--ink:#e8edf2;--muted:#95a2b0;--line:#2d3743;--accent:#7f9cff;--on:#0d1117;--rec:#ff6b6b;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:-.01em;margin-right:8px}
nav{display:flex;gap:6px;flex:1}
nav button{display:flex;align-items:center;gap:8px;border-color:transparent;background:none;color:var(--muted)}
nav b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font-size:13px}
nav button[aria-current=true]{color:var(--ink);font-weight:600}
nav button[aria-current=true] b{background:var(--accent);border-color:var(--accent);color:var(--on)}
#who{width:130px}
section{flex:1;min-height:0;padding:16px}
.center{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px;overflow:auto}
h1{font-size:26px;line-height:1.2;margin:16px 0 0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:65ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{text-align:left;padding:18px;display:flex;flex-direction:column;gap:6px;min-height:130px}
.card strong{font-size:17px}.card span{color:var(--muted)}
.card.main{border:2px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.link{border:none;background:none;color:var(--accent);padding:4px;text-decoration:underline}
#live{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
#vid{width:100%;border-radius:8px;background:#000;aspect-ratio:16/9}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);margin-right:8px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}
.interim{color:var(--muted);font-style:italic;min-height:1.4em;overflow-wrap:anywhere}
#v2{display:flex;flex-direction:column;gap:10px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools button[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}
#bMic[aria-pressed=true]{background:var(--rec);border-color:var(--rec);color:#fff}
.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.sp{flex:1}.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.work{flex:1;min-height:0;display:grid;grid-template-columns:128px minmax(0,1fr) 290px;gap:10px}
#film{overflow:auto;display:flex;flex-direction:column;gap:8px}
#film button{padding:3px;position:relative}#film canvas{width:100%;display:block;border-radius:4px}
#film button[aria-current=true]{border:2px solid var(--accent)}
#film i{position:absolute;left:6px;top:6px;background:var(--ink);color:var(--bg);border-radius:4px;font:600 11px var(--font);padding:1px 5px}
#stage{position:relative;display:grid;place-items:center;overflow:hidden;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
#cv{touch-action:none;cursor:crosshair;box-shadow:0 1px 8px rgba(0,0,0,.18)}
#pop{position:absolute;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#pop textarea{resize:none;height:70px}
#side{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
#side label{font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
#said{min-height:110px;resize:vertical}
#notes{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
#notes li>div{display:flex;gap:4px}#notes input{flex:1;min-width:0}#notes button{padding:4px 9px}
.hint{color:var(--muted);font-size:13px;margin:0}
.out{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;flex:1;min-height:320px}
#out{width:100%;height:100%;min-height:320px;resize:none;font:13px/1.5 ui-monospace,Consolas,monospace}
.acts{display:flex;flex-direction:column;gap:8px}
#thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.th{padding:4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}.th img{max-width:100%;border-radius:4px}
#say{font-weight:600;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:min(560px,calc(100% - 32px));z-index:9}
@media(max-width:820px){.work{grid-template-columns:1fr;grid-template-rows:auto minmax(260px,1fr) auto}#film{flex-direction:row}#film button{width:96px;flex:none}.out,#live{grid-template-columns:1fr}}
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,15,25,.55);padding:16px}
.mbox{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.mbox h1{margin:0;font-size:22px}.mbox input:not([type=checkbox]){width:100%}
.mbox .big{padding:16px;font-size:18px}
.ck{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
#v2 .tools{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.28);max-width:calc(100vw - 16px)}
#grip{cursor:move;touch-action:none;padding:2px 6px;color:var(--muted);user-select:none;font-size:20px}
.tools .interim{max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0}
body.full header{display:none}
body.full #stage{position:fixed;inset:0;z-index:5;border-radius:0;border:0}
</style>
</head>
<body>
<header>
  <span class="brand">Montre et dis</span>
  <nav>
    <button data-go="1"><b>1</b><span data-t="s1"></span></button>
    <button data-go="2"><b>2</b><span data-t="s2"></span></button>
    <button data-go="3"><b>3</b><span data-t="s3"></span></button>
  </nav>
  <input id="who" data-tp="who" autocomplete="off">
  <button id="lang"></button>
</header>

<section id="v1"><div class="center">
  <div id="modal" role="dialog" aria-labelledby="mh"><div class="mbox">
    <h1 id="mh" data-t="h1"></h1>
    <input id="proj" data-tp="proj" autocomplete="off" list="projList"><datalist id="projList"></datalist>
    <button class="link" id="bRoot" data-t="root"></button>
    <input id="ctx" data-tp="ctx" autocomplete="off">
    <label class="ck"><input type="checkbox" id="ckOpen" checked><span data-t="ckOpen"></span></label>
    <button class="primary big" id="bLive" data-t="liveT"></button>
    <p class="hint" data-t="liveHint"></p>
    <button class="link" id="bOpen" data-t="open"></button>
  </div></div>
  <div id="live" hidden>
    <video id="vid" muted playsinline></video>
    <div class="acts">
      <div><span class="dot"></span><strong data-t="rec"></strong> · <span id="count">0</span> <span data-t="steps"></span></div>
      <p class="sub" data-t="recHelp"></p>
      <p class="interim"></p>
      <div class="row"><button id="bSnap" data-t="snap"></button><button id="bStop" class="primary" data-t="stop"></button></div>
    </div>
  </div>
  <input type="file" id="fImg" accept="image/*" multiple hidden><input type="file" id="fSess" accept=".json,application/json" hidden>
</div></section>

<section id="v2" hidden>
  <div class="tools" id="tb">
    <span id="grip" title="Déplacer / Move">⠿</span>
    <button id="bPrev" aria-label="◀">◀</button><button id="bNx" aria-label="▶">▶</button><span class="sep"></span>
    <button data-tool="pen" data-t="pen"></button><button data-tool="arrow" data-t="arrow"></button><button data-tool="box" data-t="box"></button><button data-tool="text" data-t="text"></button><button data-tool="note" data-t="note"></button>
    <span class="sep"></span><span id="sws" class="row" style="gap:6px"></span>
    <span class="sep"></span><button id="bUndo" data-t="undo"></button><button id="bMic" data-t="mic" aria-pressed="false"></button>
    <span class="interim"></span><span class="sep"></span>
    <button id="bFull" data-t="full"></button><button id="bShot" data-t="cap"></button><button id="bAdd" data-t="add"></button><button id="bDel" data-t="del"></button><button id="bNext" class="primary" data-t="next"></button>
  </div>
  <div class="work">
    <aside id="film"></aside>
    <div id="stage"><canvas id="cv"></canvas>
      <div id="pop" hidden><textarea id="popt"></textarea><div class="row"><button id="popOk" class="primary" data-t="ok"></button><button id="popDel" data-t="rm"></button></div></div>
    </div>
    <aside id="side">
      <label for="said" data-t="said"></label><textarea id="said" data-tp="saidPh"></textarea>
      <label data-t="notes"></label><ol id="notes"></ol>
      <p class="hint" data-t="hint"></p>
    </aside>
  </div>
</section>

<section id="v3" hidden><div class="center" style="height:100%">
  <h1 data-t="h3"></h1><p class="sub" data-t="sub3"></p>
  <div class="out">
    <textarea id="out" spellcheck="false"></textarea>
    <div class="acts">
      <button id="bSend" class="primary" data-t="send"></button>
      <button id="bCopy" data-t="copy"></button>
      <button id="bDir" data-t="dir"></button>
      <button id="bDl" data-t="dlb"></button>
      <button id="bSess" data-t="sess"></button>
      <p class="hint" data-t="how"></p><p id="say"></p>
      <div id="thumbs"></div>
    </div>
  </div>
</div></section>
<div id="toast" hidden role="status"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const COL=['#ff3b30','#ff9f0a','#30d158','#0a84ff','#bf5af2'];
const CN={fr:['rouge','orange','vert','bleu','violet'],en:['red','orange','green','blue','purple']};
const FONT='system-ui,"Segoe UI",sans-serif';
const S={who:'',lang:'fr',steps:[],cur:0,tool:'pen',color:COL[0],view:1,live:false,mic:false,ready:Promise.resolve()};
const T={fr:{s1:'Montrer',s2:'Expliquer',s3:'Prompt',who:'Ton nom',proj:'Projet : tape ou choisis dans la liste',root:'Choisir le dossier qui contient mes projets',liveHint:'Choisis l\'onglet, la fenêtre ou l\'écran à partager. Un petit bouton Capture et un bouton Fin flottent par-dessus.',ckOpen:'Ouvrir une session Claude à la fin',send:'Envoyer à Claude Code',needProj:'Écris d\'abord le nom du projet.',full:'Plein écran',small:'Réduire',cap:'Capture d\'écran',
h1:'Montre ce que tu veux changer',sub1:'Aucune ligne à écrire. Choisis une façon de montrer, puis parle et dessine.',
liveT:'Démonstration en direct',liveD:'Partage la fenêtre de ton application, utilise-la et parle. Chaque phrase devient une étape avec son image.',
shotT:'Capture d\'écran',shotD:'Une image de ton application, à annoter juste après.',
fileT:'Image existante',fileD:'Colle avec Ctrl+V, dépose un fichier ici ou clique pour choisir.',
ctx:'Nom du programme (facultatif)',open:'Ouvrir une session reçue',
rec:'Enregistrement en cours',recHelp:'Va dans ton application, montre et parle. Le petit bouton flottant reste au-dessus de tout : clique-le, ou dis « capture », pour prendre une photo. Dis « OK prompt » ou clique Terminer quand tu as fini.',steps:'étape(s)',snap:'Capturer maintenant',stop:'Terminer',
pen:'Crayon',arrow:'Flèche',box:'Cadre',text:'Texte',note:'Note',undo:'Annuler',mic:'Micro',add:'Ajouter une image',del:'Supprimer l\'image',next:'Créer le prompt →',
said:'Ce que tu as dit',saidPh:'Active le micro et parle, ou écris ici.',notes:'Notes',hint:'Clic droit sur l\'image pour poser une note numérotée.',
phNote:'Ta note (tu peux la dicter)',phText:'Texte à écrire sur l\'image',ok:'OK',rm:'Supprimer',
h3:'Ton prompt est prêt',sub3:'Relis-le si tu veux, puis envoie-le à Claude.',
copy:'Copier le prompt',dir:'Enregistrer dans le dossier du projet',dlb:'Télécharger les fichiers',sess:'Enregistrer la session pour quelqu\'un d\'autre',
how:'Envoyer à Claude Code : enregistre le prompt et les images dans le dossier du projet, copie la phrase à dire et ouvre Claude Code. Claude (chat) : copie le prompt, puis clique chaque image pour la copier.',
copied:'Prompt copié',imgCopied:'Image copiée',copyImg:'Cliquer pour copier l\'image',copyFail:'Copie impossible ici. Utilise « Télécharger les fichiers ».',
need:'Ajoute d\'abord une image.',noscreen:'Ce navigateur ne permet pas le partage d\'écran. Utilise Chrome ou Edge, ou colle une capture.',
nosr:'Dictée indisponible dans ce navigateur. Utilise Chrome ou Edge, ou la dictée Windows (Win+H).',micdenied:'Micro refusé. Autorise-le dans le navigateur.',
nodir:'Dossier indisponible dans ce navigateur : les fichiers sont téléchargés.',sayIt:'Dis à Claude Code : « Fais le retour du dossier ',bad:'Fichier de session illisible.'},
en:{s1:'Show',s2:'Explain',s3:'Prompt',who:'Your name',proj:'Project: type or pick from the list',root:'Choose the folder that holds my projects',liveHint:'Pick the tab, window or screen to share. A small Capture button and a Finish button float on top.',ckOpen:'Open a Claude session at the end',send:'Send to Claude Code',needProj:'Write the project name first.',full:'Full screen',small:'Shrink',cap:'Screenshot',
h1:'Show what you want to change',sub1:'Nothing to write. Pick a way to show it, then talk and draw.',
liveT:'Live demo',liveD:'Share your app window, use it and talk. Each sentence becomes a step with its picture.',
shotT:'Screenshot',shotD:'One picture of your app, to mark up right after.',
fileT:'Existing image',fileD:'Paste with Ctrl+V, drop a file here or click to choose.',
ctx:'Program name (optional)',open:'Open a session you received',
rec:'Recording',recHelp:'Go to your app, show and talk. The small floating button stays on top of everything: click it, or say "capture", to take a picture. Say "OK prompt" or click Finish when you are done.',steps:'step(s)',snap:'Capture now',stop:'Finish',
pen:'Pen',arrow:'Arrow',box:'Box',text:'Text',note:'Note',undo:'Undo',mic:'Mic',add:'Add an image',del:'Delete image',next:'Create the prompt →',
said:'What you said',saidPh:'Turn the mic on and talk, or type here.',notes:'Notes',hint:'Right-click the image to drop a numbered note.',
phNote:'Your note (you can dictate it)',phText:'Text to write on the image',ok:'OK',rm:'Delete',
h3:'Your prompt is ready',sub3:'Read it over if you like, then send it to Claude.',
copy:'Copy the prompt',dir:'Save to the project folder',dlb:'Download the files',sess:'Save the session for someone else',
how:'Send to Claude Code: saves the prompt and images in the project folder, copies the sentence to say and opens Claude Code. Claude (chat): copy the prompt, then click each image to copy it.',
copied:'Prompt copied',imgCopied:'Image copied',copyImg:'Click to copy the image',copyFail:'Cannot copy here. Use "Download the files".',
need:'Add an image first.',noscreen:'This browser cannot share the screen. Use Chrome or Edge, or paste a screenshot.',
nosr:'Dictation is not available in this browser. Use Chrome or Edge, or Windows dictation (Win+H).',micdenied:'Mic refused. Allow it in the browser.',
nodir:'Folders are not available in this browser: files are downloaded instead.',sayIt:'Tell Claude Code: "Do the feedback in folder ',bad:'Cannot read this session file.'}};
const t=k=>T[S.lang][k]||k;
try{S.who=localStorage.getItem('who')||'';S.proj=localStorage.getItem('proj')||'';S.lang=localStorage.getItem('lang')||((navigator.language||'fr').startsWith('fr')?'fr':'en')}catch(e){}
function keep(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function applyLang(){document.documentElement.lang=S.lang;$$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$$('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));$('#bFull').textContent=t(S.full?'small':'full');$('#lang').textContent=S.lang=='fr'?'EN':'FR'}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,4500)}
function ui(){$$('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool==S.tool));$$('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c==S.color));$('#bMic').setAttribute('aria-pressed',S.mic);$$('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go==S.view));if(!S.mic)$$('.interim').forEach(e=>e.textContent='')}
function go(v){if(v>1&&!S.steps.length){toast(t('need'));v=1}closePop(true);if(v!=2&&S.full)setFull(false);S.view=v;[1,2,3].forEach(i=>$('#v'+i).hidden=i!=v);ui();if(v==2)renderAll();if(v==3)S.ready=buildOut()}

/* ---------- images ---------- */
function addStep(src,said){const w=src.videoWidth||src.naturalWidth||src.width,h=src.videoHeight||src.naturalHeight||src.height;if(!w||!h)return null;
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(src,0,0);
  const st={cv,w,h,said:said||'',shapes:[],notes:[],log:[]};S.steps.push(st);S.cur=S.steps.length-1;return st}
const loadImg=url=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url});
async function loadFiles(files){const f=[...files].filter(x=>x.type.startsWith('image/'));if(!f.length)return;
  for(const x of f){const u=URL.createObjectURL(x);try{addStep(await loadImg(u))}catch(e){}URL.revokeObjectURL(u)}if(S.steps.length)go(2)}
let stream=null,track=null,q=Promise.resolve(),lastSig=null;
async function share(){if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){toast(t('noscreen'));return false}
  try{stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false})}catch(e){return false}
  track=stream.getVideoTracks()[0];const v=$('#vid');v.srcObject=stream;await v.play().catch(()=>{});await new Promise(r=>setTimeout(r,600));return true}
async function grab(){try{if(window.ImageCapture&&track)return await new ImageCapture(track).grabFrame()}catch(e){}return $('#vid')}
function unshare(){if(stream)stream.getTracks().forEach(x=>x.stop());stream=track=null;$('#vid').srcObject=null}
const sc=document.createElement('canvas');sc.width=sc.height=24;const sx=sc.getContext('2d',{willReadFrequently:true});
function sig(src){try{sx.drawImage(src,0,0,24,24);return sx.getImageData(0,0,24,24).data.slice()}catch(e){return null}}
function diff(a,b){let d=0;for(let i=0;i<a.length;i+=4)d+=Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]);return d/(a.length/4*3)}
async function snap(text){if(!track)return;const f=await grab(),sg=sig(f),last=S.steps[S.steps.length-1];
  if(text&&last&&lastSig&&sg&&diff(sg,lastSig)<2)last.said+=(last.said?'\n':'')+text;   // même écran : la phrase rejoint l'étape
  else if(addStep(f,text||''))lastSig=sg;
  $('#count').textContent=S.steps.length;pipSet('n',S.steps.length+' '+t('steps'))}
let pip=null;
function pipSet(id,x){try{if(pip)pip.document.getElementById(id).textContent=x}catch(e){}}
function closePip(){try{pip&&pip.close()}catch(e){}pip=null}
async function openPip(){if(!window.documentPictureInPicture)return;   // petite fenêtre toujours au premier plan
  try{pip=await documentPictureInPicture.requestWindow({width:250,height:150});const d=pip.document,B='font:600 15px system-ui;border:0;border-radius:8px;padding:10px;cursor:pointer;color:#fff;';
    d.title='Montre et dis';d.body.style.cssText='margin:0;padding:8px;display:flex;flex-direction:column;gap:6px;font:13px system-ui;background:#16202b;color:#fff';
    d.body.innerHTML='<button id="s" style="'+B+'background:#e5383b;flex:1"></button><div style="display:flex;gap:6px;align-items:center"><span id="n" style="flex:1"></span><button id="e" style="'+B+'background:#2f5bea;padding:6px 10px"></button></div><div id="i" style="opacity:.75;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.3em"></div>';
    pipSet('s',t('snap'));pipSet('e',t('stop'));
    d.getElementById('s').onclick=()=>{q=q.then(()=>snap()).catch(()=>{})};d.getElementById('e').onclick=()=>stopLive();
    pip.addEventListener('pagehide',()=>{pip=null})}catch(e){pip=null}}
async function startLive(){if(!S.proj){toast(t('needProj'));$('#proj').focus();return}await openPip();if(!await share()){closePip();return}S.live=true;lastSig=null;track.onended=stopLive;$('#live').hidden=false;$('#modal').hidden=true;await snap();micOn();ui()}
function stopLive(){if(!S.live)return;S.live=false;closePip();unshare();micOff();$('#live').hidden=true;$('#modal').hidden=false;if(S.steps.length)go(2)}

/* ---------- voix ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function micOn(){if(!SR){toast(t('nosr'));return}rec=new SR();rec.lang=S.lang=='fr'?'fr-FR':'en-US';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal){const x=r[0].transcript.trim();q=q.then(()=>heard(x)).catch(()=>{})}else it+=r[0].transcript}$$('.interim').forEach(el=>el.textContent=it);pipSet('i',it)};
  rec.onend=()=>{if(S.mic)try{rec.start()}catch(e){}};
  rec.onerror=e=>{if(e.error=='not-allowed'||e.error=='service-not-allowed'){S.mic=false;ui();toast(t('micdenied'))}};
  S.mic=true;try{rec.start()}catch(e){}ui()}
function micOff(){S.mic=false;try{rec&&rec.stop()}catch(e){}ui()}
async function heard(x){if(!x)return;
  if(/^(ok|okay|o\.k\.)?[ ,]*prompte?s?[ .!]*$/i.test(x)){if(S.live)stopLive();if(S.steps.length){micOff();go(3)}return}
  if(S.live&&/^(capture( now| maintenant)?|photo|screenshot|(prends?|fais) (une |la )?(photo|capture))[ .!]*$/i.test(x))return snap();
  const line=(S.who?S.who+' : ':'')+x;
  if(pop){const a=$('#popt');a.value+=(a.value?' ':'')+x;return}
  if(S.live)return snap(line);
  const st=S.steps[S.cur];if(st&&S.view==2){st.said+=(st.said?'\n':'')+line;$('#said').value=st.said}}

/* ---------- dessin ---------- */
const cv=$('#cv'),cx=cv.getContext('2d');let cur=null,pop=null;
const U=st=>Math.max(1,Math.max(st.w,st.h)/900);
function draw(c,st,extra){const u=U(st);c.drawImage(st.cv,0,0);c.lineCap=c.lineJoin='round';
  for(const s of extra?[...st.shapes,extra]:st.shapes){c.strokeStyle=c.fillStyle=s.c;c.lineWidth=3*u;
    if(s.k=='pen'){c.beginPath();s.p.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()}
    else if(s.k=='box')c.strokeRect(Math.min(s.a[0],s.b[0]),Math.min(s.a[1],s.b[1]),Math.abs(s.b[0]-s.a[0]),Math.abs(s.b[1]-s.a[1]));
    else if(s.k=='arrow'){const[ax,ay]=s.a,[bx,by]=s.b,an=Math.atan2(by-ay,bx-ax),h=14*u;c.beginPath();c.moveTo(ax,ay);c.lineTo(bx,by);c.stroke();
      c.beginPath();c.moveTo(bx,by);c.lineTo(bx-h*Math.cos(an-.45),by-h*Math.sin(an-.45));c.lineTo(bx-h*Math.cos(an+.45),by-h*Math.sin(an+.45));c.closePath();c.fill();c.stroke()}
    else if(s.k=='text'){c.font=`600 ${17*u}px ${FONT}`;c.textBaseline='top';c.textAlign='left';c.lineWidth=4*u;c.strokeStyle='#fff';
      s.text.split('\n').forEach((l,i)=>{c.strokeText(l,s.a[0],s.a[1]+i*21*u);c.fillText(l,s.a[0],s.a[1]+i*21*u)})}}
  st.notes.forEach((n,i)=>{const r=13*u;c.beginPath();c.arc(n.x,n.y,r,0,7);c.fillStyle=n.c;c.fill();c.lineWidth=2.5*u;c.strokeStyle='#fff';c.stroke();
    c.fillStyle='#fff';c.font=`700 ${15*u}px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText(i+1,n.x,n.y+u)});c.textAlign='left'}
function paint(){const st=S.steps[S.cur];if(st)draw(cx,st,cur)}
function fit(){const st=S.steps[S.cur];if(!st)return;const b=$('#stage').getBoundingClientRect(),k=Math.min((b.width-24)/st.w,(b.height-24)/st.h,2);
  cv.width=st.w;cv.height=st.h;cv.style.width=Math.max(40,st.w*k)+'px';cv.style.height=Math.max(40,st.h*k)+'px';paint()}
function film(){const f=$('#film');f.innerHTML='';S.steps.forEach((st,i)=>{const b=document.createElement('button'),c=document.createElement('canvas'),k=220/st.w;
  c.width=220;c.height=Math.round(st.h*k);const x=c.getContext('2d');x.scale(k,k);draw(x,st);const n=document.createElement('i');n.textContent=i+1;
  b.append(c,n);b.setAttribute('aria-current',i==S.cur);b.onclick=()=>{closePop(true);S.cur=i;renderAll()};f.append(b)})}
function renderSide(){const st=S.steps[S.cur];if(!st)return;$('#said').value=st.said;const ol=$('#notes');ol.innerHTML='';
  st.notes.forEach(n=>{const li=document.createElement('li'),d=document.createElement('div'),i=document.createElement('input'),x=document.createElement('button');
    i.value=n.text;i.oninput=()=>n.text=i.value;x.textContent='×';x.setAttribute('aria-label',t('rm'));x.onclick=()=>{drop(st,n);renderSide();paint();film()};d.append(i,x);li.append(d);ol.append(li)})}
function renderAll(){fit();renderSide();film()}
function drop(st,it){[st.shapes,st.notes,st.log].forEach(a=>{const i=a.indexOf(it);if(i>=0)a.splice(i,1)})}
function pt(e){const r=cv.getBoundingClientRect();return[Math.round((e.clientX-r.left)*cv.width/r.width),Math.round((e.clientY-r.top)*cv.height/r.height)]}
function openPop(e,p,kind,item){pop={kind,p,item};const el=$('#pop'),a=$('#popt'),b=$('#stage').getBoundingClientRect();a.value=item?item.text:'';a.placeholder=t(kind=='note'?'phNote':'phText');
  el.hidden=false;el.style.left=Math.max(4,Math.min(e.clientX-b.left+14,b.width-258))+'px';el.style.top=Math.max(4,Math.min(e.clientY-b.top+14,b.height-140))+'px';$('#popDel').hidden=!item;setTimeout(()=>a.focus(),0)}
function closePop(save){if(!pop)return;const st=S.steps[S.cur],x=$('#popt').value.trim(),{kind,p,item}=pop;pop=null;$('#pop').hidden=true;
  if(save&&x&&st){if(item)item.text=x;else{const it=kind=='note'?{x:p[0],y:p[1],text:x,who:S.who,c:S.color}:{k:'text',c:S.color,a:p,text:x};(kind=='note'?st.notes:st.shapes).push(it);st.log.push(it)}}
  renderSide();paint();film()}
cv.addEventListener('pointerdown',e=>{const st=S.steps[S.cur];if(!st||e.button!==0)return;closePop(true);const p=pt(e);
  const hit=st.notes.find(n=>Math.hypot(n.x-p[0],n.y-p[1])<16*U(st));if(hit)return openPop(e,p,'note',hit);
  if(S.tool=='note'||S.tool=='text')return openPop(e,p,S.tool);
  cv.setPointerCapture(e.pointerId);cur=S.tool=='pen'?{k:'pen',c:S.color,p:[p]}:{k:S.tool,c:S.color,a:p,b:p}});
cv.addEventListener('pointermove',e=>{if(!cur)return;const p=pt(e);if(cur.k=='pen')cur.p.push(p);else cur.b=p;paint()});
function endStroke(){if(!cur)return;const st=S.steps[S.cur],ok=cur.k=='pen'?cur.p.length>2:Math.hypot(cur.b[0]-cur.a[0],cur.b[1]-cur.a[1])>4;if(ok&&st){st.shapes.push(cur);st.log.push(cur)}cur=null;paint();film()}
cv.addEventListener('pointerup',endStroke);cv.addEventListener('pointercancel',endStroke);
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(S.steps[S.cur]){closePop(true);openPop(e,pt(e),'note')}});
function undo(){const st=S.steps[S.cur];if(!st||!st.log.length)return;drop(st,st.log[st.log.length-1]);renderSide();paint();film()}

/* ---------- prompt ---------- */
const pc=(v,m)=>Math.round(v/m*100),fname=i=>`retour-${String(i+1).padStart(2,'0')}.png`;
function where(x,y,st){const fr=S.lang=='fr',h=x/st.w,v=y/st.h;
  return `${v<.33?(fr?'haut':'top'):v<.67?(fr?'milieu':'middle'):(fr?'bas':'bottom')} ${h<.33?(fr?'gauche':'left'):h<.67?(fr?'centre':'center'):(fr?'droite':'right')} · ${pc(x,st.w)} %, ${pc(y,st.h)} %`}
function mark(s,st){const fr=S.lang=='fr',col=CN[S.lang][COL.indexOf(s.c)]||'';
  if(s.k=='arrow')return fr?`flèche ${col} de [${where(...s.a,st)}] vers [${where(...s.b,st)}]`:`${col} arrow from [${where(...s.a,st)}] to [${where(...s.b,st)}]`;
  if(s.k=='text')return fr?`texte écrit « ${s.text.replace(/\n/g,' / ')} » à [${where(...s.a,st)}]`:`written text "${s.text.replace(/\n/g,' / ')}" at [${where(...s.a,st)}]`;
  const P=s.k=='pen'?s.p:[s.a,s.b],xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const z=`[${where((x0+x1)/2,(y0+y1)/2,st)}], ${pc(x1-x0,st.w)} × ${pc(y1-y0,st.h)} %`;
  return fr?`${s.k=='pen'?'tracé au crayon':'cadre'} ${col} autour de ${z} de l'image`:`${col} ${s.k=='pen'?'pen mark':'box'} around ${z} of the image`}
function buildPrompt(){const fr=S.lang=='fr',n=S.steps.length,app=$('#ctx').value.trim(),proj=S.proj,L=[];
  L.push(`# ${fr?'Retour visuel':'Visual feedback'}${(proj||app)?' — '+[proj,app].filter(Boolean).join(' / '):''} — ${new Date().toLocaleString(fr?'fr-FR':'en-GB',{dateStyle:'medium',timeStyle:'short'})}`,'',
    fr?`Tu reçois ${n} capture(s) annotée(s) : ${fname(0)}${n>1?' à '+fname(n-1):''}. Les pastilles numérotées sur chaque image correspondent aux notes ci-dessous. Les tracés de couleur montrent les zones concernées. Les positions sont en % de l'image (gauche → droite, haut → bas).`
      :`You receive ${n} annotated screenshot(s): ${fname(0)}${n>1?' to '+fname(n-1):''}. The numbered pins on each image match the notes below. Coloured marks show the areas concerned. Positions are in % of the image (left → right, top → bottom).`);
  S.steps.forEach((st,i)=>{L.push('',`## Image ${i+1} — ${fname(i)}`);let any=false;
    if(st.said.trim()){any=true;L.push(fr?'Dit à voix haute :':'Said out loud:');st.said.trim().split('\n').forEach(x=>x.trim()&&L.push('- '+x.trim()))}
    if(st.notes.length){any=true;L.push(fr?'Notes sur l\'image :':'Notes on the image:');st.notes.forEach((m,j)=>L.push(`${j+1}. [${where(m.x,m.y,st)}] ${m.text}${m.who?' ('+m.who+')':''}`))}
    if(st.shapes.length){any=true;L.push(fr?'Tracés :':'Marks:');st.shapes.forEach(s=>L.push('- '+mark(s,st)))}
    if(!any)L.push(fr?'(sans commentaire : image de contexte)':'(no comment: context image)')});
  L.push('',fr?'## Ce que j\'attends':'## What I expect',...(fr?['1. Regarde chaque image avant de lire le texte.','2. Résume en liste courte les modifications comprises, image par image.','3. Exécute-les. Si une demande est ambiguë, prends l\'interprétation la plus probable et signale-la en une ligne.','4. À la fin, dis ce qui est fait et ce qui manque.']
    :['1. Look at each image before reading the text.','2. Summarise the changes you understood as a short list, image by image.','3. Do them. If a request is ambiguous, take the most likely reading and flag it in one line.','4. At the end, say what is done and what is missing.']));
  return L.join('\n')}
async function buildOut(){$('#out').value=buildPrompt();$('#say').textContent='';const box=$('#thumbs');box.innerHTML='';
  for(const[i,st]of S.steps.entries()){const c=document.createElement('canvas');c.width=st.w;c.height=st.h;draw(c.getContext('2d'),st);st.blob=await new Promise(r=>c.toBlob(r,'image/png'));
    const b=document.createElement('button'),im=new Image();b.className='th';b.title=t('copyImg');im.src=URL.createObjectURL(st.blob);im.alt=fname(i);b.append(im,fname(i));b.onclick=()=>copyImg(st.blob);box.append(b)}}
async function copyImg(blob){try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast(t('imgCopied'))}catch(e){toast(t('copyFail'))}}
async function copyText(x,msg){try{await navigator.clipboard.writeText(x);if(msg)toast(msg)}catch(e){$('#out').select();toast(t('copyFail'))}}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000)}
async function dlAll(){await S.ready;dl(new Blob([$('#out').value],{type:'text/markdown'}),'prompt.md');for(const[i,st]of S.steps.entries()){await new Promise(r=>setTimeout(r,300));dl(st.blob,fname(i))}}
const dk=()=>'dir:'+(S.proj||'');
const idb=(m,k,v)=>new Promise((ok,no)=>{const o=indexedDB.open('montre-et-dis',1);o.onupgradeneeded=()=>o.result.createObjectStore('k');o.onerror=()=>no(o.error);
  o.onsuccess=()=>{const s=o.result.transaction('k','readwrite').objectStore('k'),r=m=='get'?s.get(k):s.put(v,k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}});
async function saveDir(pick){await S.ready;if(!window.showDirectoryPicker){toast(t('nodir'));await dlAll();return true}
  let dir=null;if(!pick){if(S.projDir)dir=S.projDir;else try{dir=await idb('get',dk())}catch(e){}}
  try{if(dir&&await dir.requestPermission({mode:'readwrite'})!='granted')dir=null}catch(e){dir=null}
  try{if(!dir){dir=await showDirectoryPicker({mode:'readwrite'});try{await idb('put',dk(),dir)}catch(e){}}
    const d=new Date(),z=n=>String(n).padStart(2,'0'),stamp=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}-${z(d.getMinutes())}-${z(d.getSeconds())}`;
    const root=await dir.getDirectoryHandle('retours',{create:true}),out=await root.getDirectoryHandle(stamp,{create:true});
    const put=async(name,data)=>{const w=await(await out.getFileHandle(name,{create:true})).createWritable();await w.write(data);await w.close()};
    await put('prompt.md',$('#out').value);for(const[i,st]of S.steps.entries())await put(fname(i),st.blob);
    const where=`retours/${stamp}`;$('#say').textContent=t('sayIt')+where+(S.lang=='fr'?' »':'"');
    copyText((S.lang=='fr'?'Lis ':'Read ')+where+'/prompt.md'+(S.lang=='fr'?' et ses images, puis exécute.':' and its images, then do it.'));toast(dir.name+'/'+where+' ✓');return true
  }catch(e){if(e.name!='AbortError')toast(String(e.message||e));return false}}
async function sendClaude(){const w=$('#ckOpen').checked?window.open('about:blank','_blank'):null;const ok=await saveDir(false);if(w){if(ok)w.location.href='https://claude.ai/code';else w.close()}}
function saveSess(){const data={v:1,ctx:$('#ctx').value,steps:S.steps.map(st=>({img:st.cv.toDataURL('image/png'),said:st.said,shapes:st.shapes,notes:st.notes}))};
  dl(new Blob([JSON.stringify(data)],{type:'application/json'}),'session-montre-et-dis.json')}
async function openSess(file){try{const d=JSON.parse(await file.text());if(d.ctx&&!$('#ctx').value)$('#ctx').value=d.ctx;
    for(const s of d.steps){const st=addStep(await loadImg(s.img),s.said);if(st){st.shapes=s.shapes||[];st.notes=s.notes||[];st.log=[...st.shapes,...st.notes]}}
    if(S.steps.length)go(2)}catch(e){toast(t('bad'))}}

/* ---------- branchements ---------- */
COL.forEach(c=>{const b=document.createElement('button');b.className='sw';b.dataset.c=c;b.style.background=c;b.setAttribute('aria-label',c);b.onclick=()=>{S.color=c;ui()};$('#sws').append(b)});
$$('nav button').forEach(b=>b.onclick=()=>{if(S.live)stopLive();go(+b.dataset.go)});
$$('[data-tool]').forEach(b=>b.onclick=()=>{S.tool=b.dataset.tool;ui()});
$('#who').value=S.who;$('#who').oninput=e=>{S.who=e.target.value.trim();keep('who',S.who)};
$('#lang').onclick=()=>{S.lang=S.lang=='fr'?'en':'fr';keep('lang',S.lang);applyLang();if(S.mic&&!S.live){micOff();micOn()}if(S.view==3)S.ready=buildOut()};
$('#bLive').onclick=startLive;$('#bStop').onclick=stopLive;$('#bSnap').onclick=()=>{q=q.then(()=>snap()).catch(()=>{})};
$('#bShot').onclick=async()=>{if(await share()){const ok=addStep(await grab());unshare();if(ok){go(2);renderAll()}}};
$('#fImg').onchange=e=>{loadFiles(e.target.files);e.target.value=''};
$('#bOpen').onclick=()=>$('#fSess').click();$('#fSess').onchange=e=>{if(e.target.files[0])openSess(e.target.files[0]);e.target.value=''};
$('#bUndo').onclick=undo;$('#bMic').onclick=()=>S.mic?micOff():micOn();$('#bAdd').onclick=()=>$('#fImg').click();$('#bPrev').onclick=()=>{if(S.cur>0){closePop(true);S.cur--;renderAll()}};$('#bNx').onclick=()=>{if(S.cur<S.steps.length-1){closePop(true);S.cur++;renderAll()}};$('#bFull').onclick=()=>setFull(!S.full);$('#bSend').onclick=sendClaude;
$('#proj').value=S.proj;$('#proj').oninput=e=>{S.proj=e.target.value.trim();keep('proj',S.proj);pickProj()};$('#proj').onfocus=()=>{if(!root)loadRoot(true)};$('#bNext').onclick=()=>go(3);
$('#bDel').onclick=()=>{closePop(false);S.steps.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);S.steps.length?renderAll():go(1)};
$('#said').oninput=e=>{const st=S.steps[S.cur];if(st)st.said=e.target.value};
$('#popOk').onclick=()=>closePop(true);$('#popDel').onclick=()=>{const st=S.steps[S.cur];if(pop&&pop.item)drop(st,pop.item);closePop(false)};
$('#popt').onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();closePop(true)}if(e.key=='Escape')closePop(false)};
$('#bCopy').onclick=()=>copyText($('#out').value,t('copied'));$('#bDir').onclick=e=>saveDir(e.shiftKey);$('#bDl').onclick=dlAll;$('#bSess').onclick=saveSess;
addEventListener('paste',e=>{const f=[...(e.clipboardData?e.clipboardData.files:[])];if(f.some(x=>x.type.startsWith('image/'))){e.preventDefault();loadFiles(f)}});
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();const f=[...e.dataTransfer.files];const j=f.find(x=>x.name.endsWith('.json'));j?openSess(j):loadFiles(f)});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='z'&&S.view==2&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();undo()}});
addEventListener('resize',()=>{if(S.view==2)fit()});
let root=null;
async function listProjects(){const dl=$('#projList');dl.innerHTML='';if(!root)return;try{for await(const[n,h]of root.entries())if(h.kind=='directory'&&!n.startsWith('.')){const o=document.createElement('option');o.value=n;dl.append(o)}}catch(e){}}
function pickProj(){S.projDir=null;const v=S.proj;if(root&&v)root.getDirectoryHandle(v).then(h=>{S.projDir=h}).catch(()=>{})}
async function loadRoot(ask){if(!window.showDirectoryPicker)return;let r=null;try{r=await idb('get','root')}catch(e){}
  if(r)try{let g=await r.queryPermission({mode:'readwrite'});if(g!='granted'&&ask)g=await r.requestPermission({mode:'readwrite'});if(g=='granted'){root=r;await listProjects();pickProj()}}catch(e){}}
$('#bRoot').onclick=async()=>{if(!window.showDirectoryPicker){toast(t('nodir'));return}try{const r=await showDirectoryPicker({mode:'readwrite',startIn:'documents'});root=r;try{await idb('put','root',r)}catch(e){}await listProjects();pickProj();$('#proj').focus()}catch(e){}};
loadRoot(false);
function setFull(on){S.full=on;document.body.classList.toggle('full',on);$('#bFull').textContent=t(on?'small':'full');
  requestAnimationFrame(()=>{if(S.view==2)fit()})}
cv.addEventListener('dblclick',()=>setFull(!S.full));
addEventListener('keydown',e=>{if(e.key=='Escape'&&S.full&&!pop)setFull(false)});
(()=>{const tb=$('#tb'),g=$('#grip');let d=null;
  g.onpointerdown=e=>{const r=tb.getBoundingClientRect();tb.style.transform='none';tb.style.left=r.left+'px';tb.style.top=r.top+'px';d=[e.clientX-r.left,e.clientY-r.top];g.setPointerCapture(e.pointerId)};
  g.onpointermove=e=>{if(!d)return;const r=tb.getBoundingClientRect();tb.style.left=Math.max(0,Math.min(e.clientX-d[0],innerWidth-r.width))+'px';tb.style.top=Math.max(0,Math.min(e.clientY-d[1],innerHeight-r.height))+'px'};
  g.onpointerup=g.onpointercancel=()=>{d=null}})();
applyLang();ui();
</script>
</body>
